<title>Hadith Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,ital,wght@7..72,0,400;7..72,0,500;7..72,0,600;7..72,1,400&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one app, two modes. A gradient filter bar carries the mode switch;
   below it a rail (topics when browsing, chapters when reading) sits beside the
   content column. Palette from manuscript illumination — lapis, jade, gold leaf
   — kept on the chrome and the narration cards, never behind running text.
   Type is set large by default and the reader can raise it further. */
:root{
  --fs:1;
  --paper:#fffdf8; --ground:#f6f1e6; --ink:#161d2e; --ink-2:#333c56;
  --muted:#6a7287; --rule:#e3dcc9;
  --lapis:#1e3170; --jade:#146055; --brass:#a97b2e; --gold:#d9a94a;
  --g-bar:linear-gradient(105deg,#141b2e 0%,#1b2f63 46%,#13564c 100%);
  --g-accent:linear-gradient(180deg,var(--gold),var(--brass));
  --g-jade:linear-gradient(180deg,#1f7a68,#12544a);
  --g-page:radial-gradient(1100px 420px at 12% -8%,rgba(30,49,112,.07),transparent 62%),
           radial-gradient(900px 380px at 92% 4%,rgba(169,123,46,.09),transparent 60%);
  --g-wash:linear-gradient(135deg,rgba(30,49,112,.055),rgba(20,96,85,.05) 55%,rgba(169,123,46,.06));
  --bar-fg:#f5f1e6; --bar-sub:#a6afc6; --bar-in:rgba(255,255,255,.10);
  --bar-edge:rgba(255,255,255,.22);
  --chip:#efe9da; --chip-fg:#454d63; --rail-hi:#efe9db;
  --gs-bg:#e0efe7; --gs-fg:#0e5539;
  --gh-bg:#efefd9; --gh-fg:#4e5615;
  --gd-bg:#f8e4de; --gd-fg:#8a3116;
  --gm-bg:#4d1512; --gm-fg:#ffdcd4;
  --gu-bg:#eae9e3; --gu-fg:#585e6b;
  --shadow:0 3px 16px rgba(22,29,46,.08);
  --serif:'Literata','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Outfit','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a2030; --ground:#11151f; --ink:#eee9dc; --ink-2:#c6cddd;
  --muted:#939bb0; --rule:#2f3748;
  --lapis:#7f9bea; --jade:#4fb69e; --brass:#dcb063; --gold:#f0cc7e;
  --g-bar:linear-gradient(105deg,#080b13 0%,#121e45 48%,#0b3b34 100%);
  --g-page:radial-gradient(1100px 420px at 12% -8%,rgba(83,116,224,.11),transparent 62%),
           radial-gradient(900px 380px at 92% 4%,rgba(220,176,99,.09),transparent 60%);
  --g-wash:linear-gradient(135deg,rgba(83,116,224,.10),rgba(79,182,158,.07) 55%,rgba(220,176,99,.08));
  --bar-fg:#eee9dc; --bar-sub:#98a1b8; --bar-in:rgba(255,255,255,.08);
  --bar-edge:rgba(255,255,255,.18);
  --chip:#272e3e; --chip-fg:#bfc6d6; --rail-hi:#232a3a;
  --gs-bg:#10362a; --gs-fg:#7fd9b5;
  --gh-bg:#2e3319; --gh-fg:#d3da7c;
  --gd-bg:#3d1b13; --gd-fg:#f4ab91;
  --gm-bg:#5f1b16; --gm-fg:#ffd3c8;
  --gu-bg:#282d3a; --gu-fg:#a6acba;
  --shadow:0 3px 16px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1a2030; --ground:#11151f; --ink:#eee9dc; --ink-2:#c6cddd;
  --muted:#939bb0; --rule:#2f3748;
  --lapis:#7f9bea; --jade:#4fb69e; --brass:#dcb063; --gold:#f0cc7e;
  --g-bar:linear-gradient(105deg,#080b13 0%,#121e45 48%,#0b3b34 100%);
  --g-page:radial-gradient(1100px 420px at 12% -8%,rgba(83,116,224,.11),transparent 62%),
           radial-gradient(900px 380px at 92% 4%,rgba(220,176,99,.09),transparent 60%);
  --g-wash:linear-gradient(135deg,rgba(83,116,224,.10),rgba(79,182,158,.07) 55%,rgba(220,176,99,.08));
  --bar-fg:#eee9dc; --bar-sub:#98a1b8; --bar-in:rgba(255,255,255,.08);
  --bar-edge:rgba(255,255,255,.18);
  --chip:#272e3e; --chip-fg:#bfc6d6; --rail-hi:#232a3a;
  --gs-bg:#10362a; --gs-fg:#7fd9b5;
  --gh-bg:#2e3319; --gh-fg:#d3da7c;
  --gd-bg:#3d1b13; --gd-fg:#f4ab91;
  --gm-bg:#5f1b16; --gm-fg:#ffd3c8;
  --gu-bg:#282d3a; --gu-fg:#a6acba;
  --shadow:0 3px 16px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--g-page),var(--ground);background-attachment:fixed;
  color:var(--ink);font-family:var(--serif);line-height:1.7}
button,select,input{font-family:inherit}
.star{position:relative;width:12px;height:12px;flex:0 0 auto}
.star::before,.star::after{content:'';position:absolute;inset:0;background:var(--g-accent)}
.star::after{transform:rotate(45deg)}

/* ---------- bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--g-bar);
  color:var(--bar-fg);box-shadow:0 2px 18px rgba(0,0,0,.2)}
.bar::after{content:'';display:block;height:4px;background:var(--g-accent)}
.bar .row{max-width:1420px;margin:0 auto;padding:13px 22px;
  display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand h1{font-family:var(--sans);font-size:calc(19px*var(--fs));letter-spacing:.11em;
  text-transform:uppercase;margin:0;font-weight:600;line-height:1.2}
.brand .sub{font-family:var(--sans);font-size:calc(11.5px*var(--fs));color:var(--bar-sub);
  letter-spacing:.14em;margin-top:3px;font-weight:500}
.modes{display:flex;flex:0 0 auto;border:1.5px solid var(--bar-edge);border-radius:10px;overflow:hidden}
.modes button{background:var(--bar-in);border:none;color:var(--bar-fg);font-family:var(--sans);
  font-size:calc(14.5px*var(--fs));padding:11px 18px;cursor:pointer;font-weight:600;min-height:44px}
.modes button+button{border-left:1.5px solid var(--bar-edge)}
.modes button[aria-pressed="true"]{background:var(--g-accent);color:#1d1403}
#q{flex:1 1 220px;min-width:130px;max-width:380px;background:var(--bar-in);
  border:1.5px solid var(--bar-edge);color:var(--bar-fg);padding:11px 15px;border-radius:9px;
  font-family:var(--sans);font-size:calc(15px*var(--fs));outline:none}
#q:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,169,74,.32)}
#q::placeholder{color:var(--bar-sub)}
#col{background:var(--bar-in);border:1.5px solid var(--bar-edge);color:var(--bar-fg);
  font-family:var(--sans);font-size:calc(14.5px*var(--fs));padding:11px;border-radius:9px;
  flex:0 0 auto;max-width:240px;font-weight:500}
#col option{background:#141b2e;color:#f5f1e6}
.seg{display:flex;flex:0 0 auto;border:1.5px solid var(--bar-edge);border-radius:9px;overflow:hidden}
.seg button{background:var(--bar-in);border:none;color:var(--bar-fg);font-family:var(--sans);
  font-size:calc(14px*var(--fs));padding:11px 15px;cursor:pointer;font-weight:500;min-height:44px}
.seg button+button{border-left:1.5px solid var(--bar-edge)}
.seg button[aria-pressed="true"]{background:var(--g-accent);color:#1d1403;font-weight:700}
.spacer{flex:1 1 auto}
.size{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.size span{font-family:var(--sans);font-size:calc(12px*var(--fs));color:var(--bar-sub);
  letter-spacing:.06em;margin-right:2px}
.size button{width:40px;height:40px;border-radius:9px;border:1.5px solid var(--bar-edge);
  background:var(--bar-in);color:var(--bar-fg);font-family:var(--sans);cursor:pointer;font-weight:600}
.size button:nth-of-type(1){font-size:13px}
.size button:nth-of-type(2){font-size:18px}
.tally{font-family:var(--sans);font-size:calc(13.5px*var(--fs));color:var(--bar-sub);
  white-space:nowrap;font-weight:500}
.railbtn{display:none;background:var(--bar-in);border:1.5px solid var(--bar-edge);color:var(--bar-fg);
  font-family:var(--sans);font-size:calc(14.5px*var(--fs));padding:11px 14px;border-radius:9px;
  cursor:pointer;min-height:44px;font-weight:500}

/* ---------- shell ---------- */
.wrap{max-width:1420px;margin:0 auto;display:flex;align-items:flex-start}
.rail{flex:0 0 292px;min-width:0;position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 76px);
  max-height:calc(100vh - 76px);overflow-y:auto;padding:22px 16px 48px}
.rail h2{font-family:var(--sans);font-size:calc(12px*var(--fs));letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:600}
.rail h2:first-of-type{margin-top:0}
.rail .eyebrow{font-family:var(--sans);font-size:calc(11.5px*var(--fs));letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px 11px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:9px;width:100%;
  background:none;border:none;text-align:left;padding:9px 11px;cursor:pointer;border-radius:8px;
  font-family:var(--sans);font-size:calc(15px*var(--fs));color:var(--ink-2);line-height:1.35;
  min-height:42px;font-weight:450}
.trow:hover{background:var(--rail-hi)}
.trow .c{font-family:var(--sans);font-size:calc(12.5px*var(--fs));color:var(--muted);
  font-variant-numeric:tabular-nums;font-weight:500}
.trow[aria-pressed="true"]{background:var(--g-jade);color:#fff;font-weight:600}
.trow[aria-pressed="true"] .c{color:var(--gold)}
.crow{display:flex;gap:12px;width:100%;background:none;border:none;text-align:left;
  padding:11px;cursor:pointer;border-radius:10px;font-family:var(--sans);
  color:var(--ink-2);line-height:1.34;align-items:baseline}
.crow:hover{background:var(--rail-hi)}
.crow .num{font-family:var(--sans);font-size:calc(12px*var(--fs));color:var(--muted);
  font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:18px;font-weight:600}
.crow .tt{font-size:calc(15px*var(--fs));font-weight:500}
.crow .er{display:block;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:2px;font-weight:400}
.crow[aria-current="true"]{background:var(--g-jade);color:#fff}
.crow[aria-current="true"] .num,.crow[aria-current="true"] .er{color:var(--gold)}
.backlink{display:block;width:100%;background:none;border:1px solid var(--rule);border-radius:9px;
  padding:10px 12px;margin-bottom:16px;cursor:pointer;font-family:var(--sans);
  font-size:calc(13.5px*var(--fs));color:var(--ink-2);text-align:left;font-weight:600}
.backlink:hover{border-color:var(--brass)}

main{flex:1 1 auto;min-width:0;padding:24px 22px 76px}
main.read{max-width:800px}

/* ---------- shared blocks ---------- */
.note{border:1px solid var(--rule);border-radius:14px;background:var(--paper);
  padding:20px 22px;margin-bottom:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.note::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--g-bar)}
.note .hd{display:flex;align-items:center;gap:10px;margin:4px 0 11px}
.note .hd strong{font-family:var(--sans);font-size:calc(14px*var(--fs));letter-spacing:.11em;
  text-transform:uppercase;font-weight:600}
.note p{margin:0 0 11px;font-size:calc(17px*var(--fs));line-height:1.72;color:var(--ink-2)}
.note p:last-child{margin-bottom:0}
.note b{color:var(--jade);font-weight:600}
.note summary{font-family:var(--sans);font-size:calc(15px*var(--fs));color:var(--brass);
  cursor:pointer;font-weight:600;padding:6px 0;min-height:34px}
.crumb{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.crumb h2{font-family:var(--sans);font-size:calc(25px*var(--fs));margin:0;font-weight:600;
  letter-spacing:-.01em;text-wrap:balance}
.crumb .ln{flex:1;height:2px;background:var(--g-accent);opacity:.5;border-radius:2px}

/* ---------- library cards ---------- */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;
  padding:20px 22px 18px;margin-bottom:14px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--g-jade)}
.card.w::before{background:var(--g-accent)}
.card.u::before{background:linear-gradient(180deg,#9aa1b2,#6a7287)}
.nar{font-family:var(--sans);font-size:calc(14px*var(--fs));letter-spacing:.05em;
  text-transform:uppercase;color:var(--jade);margin-bottom:9px;font-weight:600}
.body{font-size:calc(19px*var(--fs));line-height:1.78;color:var(--ink);max-width:68ch}
.foot{display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.stamp{font-family:var(--sans);font-size:calc(13px*var(--fs));color:var(--ink-2);
  border:1px solid var(--rule);padding:5px 11px;border-radius:7px;font-weight:500}
.gr{font-family:var(--sans);font-size:calc(13px*var(--fs));padding:5px 12px;border-radius:7px;
  white-space:nowrap;font-weight:600}
.gr.s{background:var(--gs-bg);color:var(--gs-fg)}
.gr.h{background:var(--gh-bg);color:var(--gh-fg)}
.gr.d{background:var(--gd-bg);color:var(--gd-fg)}
.gr.m{background:var(--gm-bg);color:var(--gm-fg)}
.gr.u{background:var(--gu-bg);color:var(--gu-fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-family:var(--sans);font-size:calc(13px*var(--fs));background:var(--chip);
  color:var(--chip-fg);padding:5px 12px;border:none;cursor:pointer;border-radius:7px;
  font-weight:500;min-height:32px}
.tg:hover{background:var(--g-accent);color:#1d1403;font-weight:600}
.dup{font-family:var(--sans);font-size:calc(12.5px*var(--fs));color:var(--muted)}
.vf{font-family:var(--sans);font-size:calc(13px*var(--fs));color:var(--brass);
  text-decoration:none;font-weight:600;margin-left:auto;border-bottom:1.5px solid}
.more{display:block;width:100%;margin-top:24px;padding:17px;background:var(--g-bar);
  color:var(--bar-fg);border:none;border-radius:12px;font-family:var(--sans);
  font-size:calc(15px*var(--fs));letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  font-weight:600;min-height:52px}
.more:hover{filter:brightness(1.18)}

/* ---------- narrators ---------- */
.era-band{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px}
.era-band:first-of-type{margin-top:4px}
.era-band h3{font-family:var(--sans);font-size:calc(19px*var(--fs));margin:0;font-weight:700;
  letter-spacing:-.01em}
.era-band .yr{font-family:var(--sans);font-size:calc(13px*var(--fs));color:var(--muted);
  font-weight:600;font-variant-numeric:tabular-nums}
.era-band .ln{flex:1;height:2px;background:var(--g-accent);opacity:.42;border-radius:2px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.ncard{background:var(--paper);border:1px solid var(--rule);border-radius:13px;
  padding:16px 18px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;
  font-family:inherit;color:inherit;position:relative;overflow:hidden;width:100%}
.ncard:hover{border-color:var(--brass)}
.ncard::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--g-jade)}
.ncard.undated::before{background:linear-gradient(180deg,#9aa1b2,#6a7287)}
.ncard h4{font-family:var(--sans);font-size:calc(17.5px*var(--fs));margin:0 0 4px;
  font-weight:600;line-height:1.3}
.ncard .ar{font-size:calc(15px*var(--fs));color:var(--muted);margin:0 0 9px;direction:rtl;
  text-align:left}
.ncard .nmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px}
.ncard .nb{font-family:var(--sans);font-size:calc(12px*var(--fs));padding:3px 9px;
  border-radius:6px;font-weight:600;background:var(--chip);color:var(--chip-fg)}
.ncard .nb.d{background:var(--gs-bg);color:var(--gs-fg)}
.ncard .nb.q{background:var(--gu-bg);color:var(--gu-fg)}
.ncard .cnt{font-family:var(--sans);font-size:calc(13.5px*var(--fs));color:var(--ink-2);
  font-weight:500}
.ncard .cnt b{font-weight:700;font-variant-numeric:tabular-nums}
.ncard .tps{font-family:var(--sans);font-size:calc(12.5px*var(--fs));color:var(--muted);
  margin-top:6px;line-height:1.45}
.nfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;
  padding:13px 16px;background:var(--g-wash),var(--paper);border:1px solid var(--rule);
  border-radius:12px}
.nfilter .lb{font-family:var(--sans);font-size:calc(14px*var(--fs));font-weight:600}
.nfilter button{font-family:var(--sans);font-size:calc(13px*var(--fs));background:var(--chip);
  color:var(--chip-fg);border:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600}
.nfilter button:hover{background:var(--g-accent);color:#1d1403}

/* ---------- article list ---------- */
.alist{display:flex;flex-direction:column;gap:18px;max-width:800px}
.acard{background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left;
  padding:0 0 22px;width:100%;font-family:inherit;color:inherit;border-width:1px}
.acard:hover{border-color:var(--brass)}
.acard .band{height:6px;background:var(--g-bar)}
.acard .inner{padding:20px 24px 0}
.kicker{font-family:var(--sans);font-size:calc(12px*var(--fs));letter-spacing:.17em;
  text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:10px}
.acard h3{font-family:var(--sans);font-size:calc(30px*var(--fs));margin:0 0 10px;font-weight:700;
  letter-spacing:-.02em;line-height:1.16;text-wrap:balance}
.acard .dek{font-size:calc(17.5px*var(--fs));color:var(--ink-2);margin:0 0 15px;line-height:1.6}
.acard .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--sans);font-size:calc(12.5px*var(--fs));background:var(--chip);
  color:var(--chip-fg);padding:5px 12px;border-radius:7px;font-weight:600}
.pill.g{background:var(--gs-bg);color:var(--gs-fg)}

/* ---------- article reader ---------- */
.srcnote{margin:16px 0 26px;padding:14px 17px;border-left:3px solid var(--brass);
  background:var(--g-wash);border-radius:0 8px 8px 0;font-size:calc(14.5px*var(--fs));
  color:var(--ink-2);line-height:1.62}
.chap .head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.chap .n{font-family:var(--sans);font-size:calc(13px*var(--fs));font-weight:700;
  color:#fff;background:var(--g-jade);border-radius:7px;padding:4px 11px;flex:0 0 auto}
.chap h2{font-family:var(--sans);font-size:calc(30px*var(--fs));margin:0;font-weight:700;
  letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
.chap .era{font-family:var(--sans);font-size:calc(13.5px*var(--fs));color:var(--muted);
  font-weight:500;letter-spacing:.04em;margin:0 0 20px}
.chap .rule{height:2px;background:var(--g-accent);opacity:.5;border-radius:2px;margin:0 0 22px}
.sec{margin-bottom:34px}
.sec h3{font-family:var(--sans);font-size:calc(22px*var(--fs));margin:0 0 14px;font-weight:600;
  letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
.sec p{font-size:calc(19px*var(--fs));line-height:1.8;margin:0 0 17px;color:var(--ink)}
.sec p em{font-style:italic;color:var(--ink-2)}
.hadith{background:var(--g-wash),var(--paper);border:1px solid var(--rule);
  border-radius:14px;padding:20px 22px 17px;margin:22px 0;position:relative;overflow:hidden}
.hadith::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--g-jade)}
.hadith .label{display:flex;align-items:center;gap:8px;font-family:var(--sans);
  font-size:calc(11.5px*var(--fs));letter-spacing:.14em;text-transform:uppercase;
  color:var(--jade);font-weight:700;margin-bottom:11px}
.hadith .q{font-size:calc(18px*var(--fs));line-height:1.76;color:var(--ink);font-style:italic}
.hadith .cite{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:15px;
  padding-top:13px;border-top:1px solid var(--rule)}
.hadith .ref{font-family:var(--sans);font-size:calc(13.5px*var(--fs));font-weight:600;color:var(--ink-2)}
.hadith .bk{font-family:var(--sans);font-size:calc(12.5px*var(--fs));color:var(--muted)}

</div></div>

<div class="wrap">
  <nav class="rail" id="rail" data-open="0" aria-label="Sidebar"></nav>
  <main id="main"><div class="load">Loading…</div></main>
</div>

<script>
/* ---------- constants ---------- */
const NAMES={bukhari:'Ṣaḥīḥ al-Bukhārī',muslim:'Ṣaḥīḥ Muslim',abudawud:'Sunan Abī Dāwūd',
 tirmidhi:'Jāmiʿ at-Tirmidhī',nasai:'Sunan an-Nasāʾī',ibnmajah:'Sunan Ibn Mājah',
 malik:'al-Muwaṭṭaʾ',ahmed:'Musnad Aḥmad (partial)'};
const ORDER=['bukhari','muslim','abudawud','tirmidhi','nasai','ibnmajah','malik','ahmed'];
const GROUPS=[
 ["Worship & Ritual",["Faith & Creed","Prayer (Salah)","Purity & Wudu","Adhan & the Mosque","Night & Voluntary Prayer","Zakah & Charity","Fasting & Ramadan","Hajj & Umrah","Eid & Sacrifice","Quran & Recitation","Dhikr & Supplication","Repentance & Forgiveness"]],
 ["Family & Household",["Parents","Marriage & Spouses","Women","Children & Upbringing","Relatives & Kinship","Neighbours","Orphans & the Weak","Servants & Freeing Slaves","Guests & Hospitality","Brotherhood & Friendship"]],
 ["Character & the Heart",["Character & Manners","Truthfulness & Lying","Anger & Patience","Humility & Pride","Speech & Backbiting","Envy & Suspicion","Mercy & Kindness","Modesty & Dress","Knowledge & Scholars"]],
 ["Sins & Prohibitions",["Major Sins","Adultery & Chastity","Alcohol & Intoxicants","Theft & Property","Usury & Interest","Oppression & Injustice","Bloodshed & Murder","Magic & Superstition"]],
 ["Wealth, Law & Society",["Trade & Business","Debt & Loans","Inheritance & Wills","Justice & Judgement","Leadership & Governance","Oaths & Vows","Work & Livelihood","Treaties & Non-Muslims","Jihad & Battles"]],
 ["Death & the Hereafter",["Death & Burial","The Grave & Barzakh","Day of Judgement","Resurrection & Intercession","Paradise","Hellfire","Signs of the End Times","Destiny & Decree","Angels & the Unseen"]],
 ["Life, Body & World",["Food & Drink","Medicine & Healing","Trials & Illness","Dreams & Visions","Animals","Travel & Migration","Time, Days & Nights"]],
 ["Prophets & History",["Prophets & Past Peoples","The Prophet's Life & Person","Other Narrations"]],
];
const PAGE=25, STEPS=[0.92,1,1.12,1.26,1.42];

/* ---------- state ---------- */
let mode='lib', fsi=1;
let D=null, dataErr=null, COUNT={}, topic=null, query='', source='A', grade='ALL',
    shown=0, matches=[];
let MAN=null, ART=null, ai=null, ci=0;   // manifest, open article, its index, chapter
let NAR=null, NMAP=null, narFilter=null; // narrators, raw-name -> key, active filter

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function em(s){return esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function gcls(g){
  if(!g) return 'u';
  if(g.indexOf('Mawdu')===0) return 'm';
  if(g.indexOf('Sahih')===0) return 's';
  if(g.indexOf('Hasan')>=0) return 'h';
  if(g.indexOf("Da'if")>=0||g.indexOf('Munkar')>=0||g.indexOf('Shadh')>=0) return 'd';
  return 'u';
}
function gradeOK(g){
  const c=gcls(g);
  if(grade==='ALL') return true;
  if(grade==='SH')  return c==='s';
  if(grade==='SHH') return c==='s'||c==='h';
  if(grade==='WK')  return c==='d'||c==='m';
  return true;
}
function pool(){
  if(!D) return [];
  return D.filter(h=>(source==='A'||h.s===source)&&gradeOK(h.g)&&
    (!narFilter||(NMAP&&NMAP.get((h.nr||'').trim())===narFilter)));
}
function recount(){ COUNT={}; pool().forEach(h=>h.t.forEach(t=>COUNT[t]=(COUNT[t]||0)+1)); }
function applyFs(){
  document.documentElement.style.setProperty('--fs',String(STEPS[fsi]));
  document.getElementById('fsdn').disabled=fsi===0;
  document.getElementById('fsup').disabled=fsi===STEPS.length-1;
}
// Library-only controls are irrelevant while reading, so hide rather than disable.
function syncChrome(){
  const lib=mode==='lib';
  ['q','col','seg','tally'].forEach(id=>{document.getElementById(id).hidden=!lib;});
  document.getElementById('main').className=(mode==='art')?'read':'';
  document.querySelectorAll('#modes button').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.m===mode)));
}

/* ---------- rail ---------- */
function buildRail(){
  const rail=document.getElementById('rail');
  if(mode==='lib'){
    if(!D){ rail.innerHTML='<p class="eyebrow">Topics</p><p class="load" style="padding:20px 11px">Loading…</p>'; return; }
    let h=`<button class="trow" data-t="__all" aria-pressed="${topic?'false':'true'}">All narrations <span class="c">${pool().length.toLocaleString()}</span></button>`;
    const placed=new Set();
    GROUPS.forEach(([g,ts])=>{
      const live=ts.filter(t=>COUNT[t]); ts.forEach(t=>placed.add(t));
      if(!live.length) return;
      h+=`<h2>${esc(g)}</h2>`;
      live.forEach(t=>{h+=`<button class="trow" data-t="${esc(t)}" aria-pressed="${topic===t?'true':'false'}">${esc(t)} <span class="c">${COUNT[t]}</span></button>`;});
    });
    const rest=Object.keys(COUNT).filter(t=>!placed.has(t)).sort();
    if(rest.length){
      h+=`<h2>Further topics</h2>`;
      rest.forEach(t=>{h+=`<button class="trow" data-t="${esc(t)}" aria-pressed="${topic===t?'true':'false'}">${esc(t)} <span class="c">${COUNT[t]}</span></button>`;});
    }
    rail.innerHTML=h;
    return;
  }
  if(mode==='nar'){
    if(!NAR){ rail.innerHTML='<p class="eyebrow">Eras</p><p class="load" style="padding:20px 11px">Loading…</p>'; return; }
    const bands=eraBands();
    rail.innerHTML='<p class="eyebrow">Eras</p>'+bands.map((b,i)=>
      `<button class="trow" data-era="${i}">${esc(b.label)} <span class="c">${b.rows.length}</span></button>`).join('');
    return;
  }
  // articles
  if(!ART){
    rail.innerHTML='<p class="eyebrow">Series</p>'+
      (MAN?MAN.articles.map((a,i)=>
        `<button class="crow" data-a="${i}"><span class="num">${i+1}</span>
          <span><span class="tt">${esc(a.title)}</span>
          <span class="er">${a.chapters} chapters</span></span></button>`).join('')
        :'<p class="load" style="padding:20px 11px">Loading…</p>');
    return;
  }
  rail.innerHTML='<button class="backlink" id="allart">← All series</button>'+
    '<p class="eyebrow">'+esc(ART.kicker||'Chapters')+'</p>'+
    ART.chapters.map((c,i)=>
      `<button class="crow" data-c="${i}" aria-current="${i===ci}">
         <span class="num">${c.n}</span>
         <span><span class="tt">${esc(c.title)}</span><span class="er">${esc(c.era)}</span></span>
       </button>`).join('');
}

/* ---------- library view ---------- */
function recompute(){
  const ql=query.trim().toLowerCase();
  matches=pool().filter(h=>{
    if(topic&&!h.t.includes(topic)) return false;
    if(!ql) return true;
    return h.x.toLowerCase().includes(ql)||h.nr.toLowerCase().includes(ql)||
           h.b.toLowerCase().includes(ql)||h.t.some(t=>t.toLowerCase().includes(ql));
  });
  document.getElementById('tally').textContent=
    matches.length.toLocaleString()+(matches.length===1?' narration':' narrations');
  renderLib();
}
function renderLib(){
  const m=document.getElementById('main');
  if(dataErr){ m.innerHTML=dataErr; return; }
  if(!D){ m.innerHTML='<div class="load">Loading 20,603 narrations…</div>'; return; }
  m.innerHTML=
    `<div class="note">
      <div class="hd"><span class="star"></span><strong>What this is</strong></div>
      <p><b>${D.length.toLocaleString()}</b> distinct narrations from eight collections, filtered to <b>marfūʿ</b> reports — what the Prophet ﷺ said, did, ordered, or approved. Companion opinions and compiler chapter commentary are screened out, near-identical repetitions through different chains are merged and recorded rather than deleted, and the whole corpus is arranged across <b>${Object.keys(COUNT).length}</b> practical topics instead of the compilers' original chapters.</p>
      <details>
        <summary>Read the limits before relying on any of it</summary>
        <p style="margin-top:10px">Only <b>Ṣaḥīḥ al-Bukhārī</b> and <b>Ṣaḥīḥ Muslim</b> are sound throughout — that is what <i>Ṣaḥīḥ</i> in their titles claims. The four <i>Sunan</i> deliberately include weak material, so each narration carries a grade; <b>al-Muwaṭṭaʾ</b> and the partial <b>Musnad Aḥmad</b> have no grading source and show as ungraded, which means unverified, not authentic.</p>
        <p>Grades come from the LK Ḥadīth Corpus (Leeds / King Saud University) and are al-Albānī's; other scholars grade differently. They were joined to each narration by matching wording, because the two sources number ḥadīth incompatibly — that join succeeded for over 99% in every collection, and it self-checks, since Bukhārī and Muslim come back essentially all ṣaḥīḥ.</p>
        <p>Topic labels are assigned by keyword, so a narration can sit under a topic it only touches in passing. Browse with them; don't cite them. Reference numbers follow the source dataset and differ from sunnah.com's, so each card carries a <b>verify</b> link that searches by wording instead. For anything you intend to act on, read the Arabic and ask someone trained in the sciences of ḥadīth.</p>
      </details>
    </div>
    ${narFilter?(()=>{const r=(NAR||[]).find(x=>x.key===narFilter);
      if(!r) return '';
      const yr=r.death_h!=null?` · d. ${r.death_h} AH`:'';
      return `<div class="nfilter"><span class="lb">Narrations of ${esc(r.name)}${esc(yr)}</span>
        <button id="clearnar">Clear</button></div>`;})():''}
    <div class="crumb"><span class="star"></span><h2>${esc(topic||'All narrations')}</h2><span class="ln"></span></div>
    <div id="out"></div>
    <button class="more" id="more" hidden>Load more</button>`;
  shown=0; page();
  document.getElementById('more').addEventListener('click',page);
}
function page(){
  const out=document.getElementById('out'); if(!out) return;
  if(!matches.length){
    out.innerHTML='<div class="none">No narrations match. Try another word, or pick a different topic or grade.</div>';
    document.getElementById('more').hidden=true; return;
  }
  const slice=matches.slice(shown,shown+PAGE);
  const frag=document.createElement('div');
  frag.innerHTML=slice.map(h=>{
    const cls=gcls(h.g);
    const nar=h.nr?esc(h.nr.replace(/^Narrated\s*/i,'').replace(/:$/,'')):'';
    const dup=(h.also&&h.also.length)
      ?`<span class="dup">also at ${h.also.slice(0,3).join(', ')}${h.also.length>3?'…':''}</span>`:'';
    return `<article class="card ${cls==='s'?'':cls==='u'?'u':'w'}">
      ${nar?`<div class="nar">Narrated ${nar}</div>`:''}
      <div class="body">${esc(h.x)}</div>
      <div class="foot">
        <span class="gr ${cls}">${esc(h.g||'no grade')}</span>
        <span class="stamp">${esc(NAMES[h.s]||h.s)} · ${esc(h.b)} · no. ${h.n}</span>
        <span class="tags">${h.t.map(t=>`<button class="tg" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</span>
        ${dup}
        <a class="vf" target="_blank" rel="noopener"
           href="https://sunnah.com/search?q=${encodeURIComponent(h.q||'')}">verify ↗</a>
      </div></article>`;
  }).join('');
  while(frag.firstChild) out.appendChild(frag.firstChild);
  shown+=slice.length;
  const mb=document.getElementById('more');
  mb.hidden=shown>=matches.length;
  mb.textContent=`Load more · ${(matches.length-shown).toLocaleString()} remaining`;
}

/* ---------- articles view ---------- */
function renderArtList(){
  const m=document.getElementById('main');
  if(!MAN){ m.innerHTML='<div class="load">Loading the series…</div>'; return; }
  m.innerHTML='<div class="crumb"><span class="star"></span><h2>Articles</h2><span class="ln"></span></div>'+
   '<div class="alist">'+MAN.articles.map((a,i)=>
    `<button class="acard" data-a="${i}">
       <div class="band"></div>
       <div class="inner">
         <p class="kicker">${esc(a.kicker)}</p>
         <h3>${esc(a.title)}</h3>
         <p class="dek">${esc(a.summary||a.subtitle)}</p>
         <div class="meta">
           <span class="pill">${a.chapters} chapters</span>
           <span class="pill">${esc(a.readingTime)}</span>
           <span class="pill g">${a.narrations} authentic narrations</span>
         </div>
       </div></button>`).join('')+'</div>';
}
function hadithHtml(h){
  const url='https://sunnah.com/search?q='+encodeURIComponent(h.verify||h.text.slice(0,60));
  return `<figure class="hadith">
    <figcaption class="label"><span class="star"></span>Narration</figcaption>
    <div class="q">${esc(h.text)}</div>
    <div class="cite">
      <span class="ref">${esc(h.src)} no. ${h.n}</span>
      <span class="bk">${esc(h.book)}</span>
      <span class="gr s">${esc(h.grade)}</span>
      <a class="vf" href="${url}" target="_blank" rel="noopener">verify ↗</a>
    </div></figure>`;
}
function renderArt(){
  const c=ART.chapters[ci], m=document.getElementById('main');
  let html='';
  if(ci===0){
    html+=`<div class="crumb"><span class="star"></span><h2>${esc(ART.title)}</h2><span class="ln"></span></div>
      <p class="srcnote">${esc(ART.sourceNote)}</p>`;
  }
  html+=`<article class="chap">
    <div class="head"><span class="n">${c.n}</span><h2>${esc(c.title)}</h2></div>
    <p class="era">${esc(c.era)}</p><div class="rule"></div>`;
  c.sections.forEach(s=>{
    html+=`<section class="sec"><h3>${esc(s.heading)}</h3>`+
      s.paras.map(p=>`<p>${em(p)}</p>`).join('')+
      (s.hadith||[]).map(hadithHtml).join('')+'</section>';
  });
  html+='</article>';
  const prev=ART.chapters[ci-1], next=ART.chapters[ci+1];
  html+=`<nav class="nav">
    <button id="prev" ${prev?'':'disabled'}><span class="dir">Previous</span>
      <span class="lb">${prev?esc(prev.title):'Start of series'}</span></button>
    <button id="next" class="next" ${next?'':'disabled'}><span class="dir">Next</span>
      <span class="lb">${next?esc(next.title):'End of series'}</span></button></nav>`;
  m.innerHTML=html;
  if(prev) document.getElementById('prev').addEventListener('click',()=>goChap(ci-1));
  if(next) document.getElementById('next').addEventListener('click',()=>goChap(ci+1));
  document.querySelectorAll('.crow').forEach(b=>
    b.setAttribute('aria-current',String(+b.dataset.c===ci)));
}
function goChap(i){
  ci=i; document.getElementById('rail').dataset.open='0';
  renderArt(); window.scrollTo({top:0});
}
function openArticle(i){
  ai=i;
  const entry=MAN.articles[i];
  document.getElementById('main').innerHTML='<div class="load">Opening…</div>';
  fetch('articles/'+entry.file).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(d=>{ ART=d; ci=0; buildRail(); renderArt(); window.scrollTo({top:0}); })
   .catch(e=>{document.getElementById('main').innerHTML=
     '<div class="none">That article could not be loaded ('+esc(e.message)+').</div>';});
}
function closeArticle(){
  ART=null; ai=null; buildRail(); renderArtList(); window.scrollTo({top:0});
}

/* ---------- narrators ---------- */
// Chronological bands. Narrators whose death year the source could not be
// trusted on fall into a final band rather than being given a guessed date.
const BANDS=[
  [0,40,'The first generation','to 40 AH'],
  [41,70,'The Companions who outlived the conquests','41–70 AH'],
  [71,110,'The last of the Companions','71–110 AH'],
  [111,180,'The Successors','111–180 AH'],
  [181,320,'The generation of the compilers','181–320 AH'],
];
function eraBands(){
  const out=BANDS.map(([lo,hi,label,yr])=>({lo,hi,label,yr,rows:[]}));
  const undated={label:'Date not established',yr:'—',rows:[]};
  (NAR||[]).forEach(r=>{
    if(r.death_h==null){ undated.rows.push(r); return; }
    const b=out.find(x=>r.death_h>=x.lo&&r.death_h<=x.hi);
    (b||undated).rows.push(r);
  });
  out.forEach(b=>b.rows.sort((a,c)=>a.death_h-c.death_h));
  undated.rows.sort((a,c)=>c.n-a.n);
  return out.filter(b=>b.rows.length).concat(undated.rows.length?[undated]:[]);
}
function ncard(r){
  const dated=r.death_h!=null;
  const yr=dated?`d. ${r.death_h} AH${r.death_g?` / ${r.death_g} CE`:''}`:'Date not established';
  const cols=Object.entries(r.cols).slice(0,3)
    .map(([k,v])=>`${NAMES[k]||k} ${v}`).join(' · ');
  return `<button class="ncard${dated?'':' undated'}" data-k="${esc(r.key)}">
    <h4>${esc(r.name)}</h4>
    ${r.ar?`<p class="ar">${esc(r.ar)}</p>`:''}
    <div class="nmeta">
      <span class="nb ${dated?'d':'q'}">${esc(yr)}</span>
      ${r.gen&&r.gen!=='Unplaced'?`<span class="nb">${esc(r.gen)}</span>`:''}
    </div>
    <div class="cnt"><b>${r.n.toLocaleString()}</b> narration${r.n===1?'':'s'} here${
      r.sahih?` · ${r.sahih.toLocaleString()} ṣaḥīḥ`:''}</div>
    ${cols?`<div class="tps">${esc(cols)}</div>`:''}
    ${r.topics.length?`<div class="tps">${esc(r.topics.slice(0,3).join(' · '))}</div>`:''}
  </button>`;
}
function renderNar(){
  const m=document.getElementById('main');
  if(!NAR){ m.innerHTML='<div class="load">Loading the narrators…</div>'; return; }
  const bands=eraBands();
  const dated=NAR.filter(r=>r.death_h!=null).length;
  m.innerHTML=
    `<div class="note">
      <div class="hd"><span class="star"></span><strong>Who transmitted this</strong></div>
      <p>The <b>${NAR.length.toLocaleString()}</b> people named as narrators of the hadith in this app, ordered by when they died. Each card's <b>counts, collections and topics are derived from this app's own graded dataset</b> — they are exact. Select a narrator to read their narrations.</p>
      <details>
        <summary>Why most of them carry no date</summary>
        <p style="margin-top:10px">Dates, generation and the Arabic name come from an external community narrator dataset, matched by name. <b>A name is not a unique identifier in this material</b> — "ʿAbdullāh bin ʿUmar" names six different people in that source, and the famous Companion is not among them. Matching by name alone produced a Companion dated to 190 AH and Ibn az-Zubayr, who died in 73, dated to 12.</p>
        <p>So a date is shown only where exactly one person fits the name <i>and</i> the year agrees with the generation assigned to them. That leaves <b>${dated}</b> of ${NAR.length.toLocaleString()} dated. The rest are listed last, by volume, with no date rather than a guessed one. For anything that turns on a narrator's identity, use a proper rijāl reference — this is a finding aid.</p>
      </details>
    </div>`+
    bands.map(b=>`<div class="era-band"><h3>${esc(b.label)}</h3>
      <span class="yr">${esc(b.yr)}</span><span class="ln"></span></div>
      <div class="ngrid">${b.rows.map(ncard).join('')}</div>`).join('');
}

function showNarrator(k){
  narFilter=k; mode='lib'; topic=null; query='';
  const qi=document.getElementById('q'); if(qi) qi.value='';
  document.getElementById('rail').dataset.open='0';
  recount(); syncChrome(); buildRail(); recompute(); window.scrollTo({top:0});
}

/* ---------- routing ---------- */
function render(){
  syncChrome();
  if(mode==='lib') renderLib();
  else if(mode==='nar') renderNar();
  else if(ART) renderArt();
  else renderArtList();
}
function setMode(m){
  mode=m; document.getElementById('rail').dataset.open='0';
  buildRail(); render(); window.scrollTo({top:0});
}

/* ---------- events ---------- */
document.getElementById('modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; setMode(b.dataset.m);
});
document.getElementById('rail').addEventListener('click',e=>{
  if(e.target.closest('#allart')){ closeArticle(); return; }
  const era=e.target.closest('[data-era]');
  if(era&&mode==='nar'){
    document.getElementById('rail').dataset.open='0';
    const h=document.querySelectorAll('.era-band')[+era.dataset.era];
    if(h) h.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const t=e.target.closest('.trow');
  if(t){
    topic=t.dataset.t==='__all'?null:t.dataset.t;
    document.getElementById('rail').dataset.open='0';
    buildRail(); recompute(); window.scrollTo({top:0}); return;
  }
  const c=e.target.closest('.crow'); if(!c) return;
  document.getElementById('rail').dataset.open='0';
  if(c.dataset.c!==undefined) goChap(+c.dataset.c);
  else if(c.dataset.a!==undefined) openArticle(+c.dataset.a);
});
document.getElementById('main').addEventListener('click',e=>{
  const n=e.target.closest('.ncard');
  if(n){ showNarrator(n.dataset.k); return; }
  const cl=e.target.closest('#clearnar');
  if(cl){ narFilter=null; recount(); buildRail(); recompute(); window.scrollTo({top:0}); return; }
  const a=e.target.closest('.acard');
  if(a){ openArticle(+a.dataset.a); return; }
  const b=e.target.closest('.tg'); if(!b) return;
  topic=b.dataset.t; query=''; document.getElementById('q').value='';
  buildRail(); recompute(); window.scrollTo({top:0});
});
document.getElementById('col').addEventListener('change',e=>{
  source=e.target.value; recount();
  if(topic&&!COUNT[topic]) topic=null;
  buildRail(); recompute(); window.scrollTo({top:0});
});
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  grade=b.dataset.g;
  document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  recount();
  if(topic&&!COUNT[topic]) topic=null;
  buildRail(); recompute(); window.scrollTo({top:0});
});
document.getElementById('fsup').addEventListener('click',()=>{if(fsi<STEPS.length-1){fsi++;applyFs();}});
document.getElementById('fsdn').addEventListener('click',()=>{if(fsi>0){fsi--;applyFs();}});
let timer;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(timer); const v=e.target.value;
  timer=setTimeout(()=>{query=v; recompute();},170);
});
document.getElementById('railbtn').addEventListener('click',()=>{
  const r=document.getElementById('rail');
  r.dataset.open=r.dataset.open==='1'?'0':'1';
});

/* ---------- boot ----------
   Two fetches in parallel. The manifest is ~1 KB and the article ~40 KB, against
   13.7 MB of narrations, so Articles is usable long before the library finishes
   downloading — hence no await between them. */
applyFs(); syncChrome();

function loadFailure(err){
  const local=location.protocol==='file:';
  return '<div class="none">'+(local
    ? 'Browsers block data files when a page is opened straight from disk, so this '+
      'cannot load that way.<br><br>Serve the folder instead — run '+
      '<code>python3 -m http.server 8000</code> in the repository root, then open '+
      '<code>http://localhost:8000/app/</code>.<br><br>For a single file that opens '+
      'with no server, run <code>python3 scripts/build_app_data.py --standalone</code>.'
    : 'The data could not be loaded ('+esc(err.message)+'). Reload the page to try again.')+
    '</div>';
}

fetch('narrators.json').then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
  .then(d=>{
    NAR=d.narrators;
    NMAP=new Map();
    NAR.forEach(r=>(r.raw||[]).forEach(v=>NMAP.set(v,r.key)));
    if(mode==='nar'){ buildRail(); render(); }
  })
  .catch(()=>{ NAR=[]; NMAP=new Map(); if(mode==='nar'){ buildRail(); render(); } });

fetch('articles/manifest.json').then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
  .then(d=>{ MAN=d; if(mode==='art') { buildRail(); render(); } })
  .catch(()=>{ MAN={articles:[]}; if(mode==='art'){ buildRail(); render(); } });

fetch('hadith.json').then(r=>{
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}).then(data=>{
  D=data;
  const cnt={}; D.forEach(h=>cnt[h.s]=(cnt[h.s]||0)+1);
  document.getElementById('col').innerHTML=
    `<option value="A">All collections (${D.length.toLocaleString()})</option>`+
    ORDER.map(k=>`<option value="${k}">${NAMES[k]} (${(cnt[k]||0).toLocaleString()})</option>`).join('');
  recount(); buildRail();
  if(mode==='lib') recompute();
}).catch(err=>{
  dataErr=loadFailure(err);
  if(mode==='lib') renderLib();
});
</script>
